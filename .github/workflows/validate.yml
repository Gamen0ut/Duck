name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin.json is valid and complete
        run: |
          # Fields DMS's plugin-schema.json requires (capabilities: at least one)
          jq -e '.id and .name and .description and .version and .author and .type and .component' plugin.json
          jq -e '(.capabilities | type == "array") and (.capabilities | length > 0)' plugin.json
          for f in $(jq -r '.component, .settings // empty' plugin.json); do
            test -f "$f" || { echo "Missing $f" >&2; exit 1; }
          done
          jq -r .version plugin.json | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: for f in tests/*.test.js; do echo "== $f"; node "$f" || exit 1; done
